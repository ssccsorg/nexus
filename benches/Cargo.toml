[package]
name = "nexus-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Unified benchmark suite for nexus FIH storage (CoordSpaceN + HashMap)"

[dependencies]
futures-executor = "0.3"
nex-core = { path = "../nex/core" }
nex-fih = { path = "../nex/fih" }
nexus-storage-sim = { path = "../storage/sim" }
postcard = "1"
tagma-core = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5" }

[[bench]]
name = "bench"
path = "bench.rs"
harness = false
