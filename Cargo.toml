[workspace]
resolver = "2"
members = [
    "fih",
    "nex-server/server",
    "nex-server/client",
    "nexd",
    "libs/serde-proxy",
    "libs/session-server",
    "libs/async-store",
    "playbooks/agents",
    "interface/query",
    "storage/sim",
    "apps/nex-calc",
    "benches",
    ]
exclude = [
    "apps/nex-wasmer-ssccsdocs",
    "apps/nex-spinwasi-ssccsdocs",
    "apps/nex-tagma",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
async-trait = "0.1"
chton = { git = "file:///Users/blackgene/Documents/ct", branch = "181-no-std", default-features = false }
# TEMP: chton's 181-no-std branch resolves tagma from the GitHub branch
# (5bd1338), so tagma stays on the GitHub source to keep a single tagma
# revision in the graph. Flip chton to the GitHub URL once the chton
# branch is pushed and its TEMP local refs are removed.
tagma-core = { git = "https://github.com/ssccsorg/syntagma", branch = "181-tagma-geo-nostd" }
tagma-map = { git = "https://github.com/ssccsorg/syntagma", branch = "181-tagma-geo-nostd" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
