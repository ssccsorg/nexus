# A reading is a path the router owns, so a request that names no file is the page. The assets are content addressed by
# the build, so they stay cached until the page names different ones.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
