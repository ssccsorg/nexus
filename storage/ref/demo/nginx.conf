# A reading is a path the router owns, so a request that names no file is the page. The assets are content addressed by
# the build, so they stay cached until the page names different ones.
#
# The board reads its own files, so it asks the browser for no device. The policy is the server's answer to that, and it
# is a header rather than a habit: a component added later that asks for a camera is refused rather than prompted for.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Permissions-Policy "accelerometer=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), notifications=(), payment=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "accelerometer=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), notifications=(), payment=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
