[package]
name = "nexus-storage-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nex-core = { path = "../../nex/core" }
nex-fih = { path = "../../nex/fih" }
nex = { path = "../../nex/process" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
cfg-if = "1"
futures-executor = "0.3"


[dev-dependencies]
tempfile = "3"
serde_json = "1"
nexus-gateway-serde-proxy = { path = "../../libs/serde-proxy" }
