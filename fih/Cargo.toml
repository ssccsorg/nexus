[package]
name = "fih-model"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tagma-core = { git = "https://github.com/ssccsorg/syntagma", branch = "main" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-executor = "0.3"
