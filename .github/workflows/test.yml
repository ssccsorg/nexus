name: Test Suite

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "model/**"
      - "nex/**"
      - "nexd/**"
      - "nex-server/**"
      - "gateway/**"
      - "apps/nex-api/**"
      - "apps/nex-cf/**"
      - "interface/**"
      - "storage/**"
      - "libs/**"
      - "apps/nex-spinwasi-ssccsdocs/**"
      - "apps/nex-calc/**"
      - "playbooks/**"
      - "scripts/**"
      - "run.sh"
      - ".github/workflows/test.yml"
      - "!**/*.md"
      - "!**/*.qmd"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "model/**"
      - "nex/**"
      - "nexd/**"
      - "nex-server/**"
      - "gateway/**"
      - "apps/nex-api/**"
      - "apps/nex-cf/**"
      - "interface/**"
      - "storage/**"
      - "libs/**"
      - "apps/nex-spinwasi-ssccsdocs/**"
      - "apps/nex-calc/**"
      - "playbooks/**"
      - "scripts/**"
      - "run.sh"
      - ".github/workflows/test.yml"
      - "!**/*.md"
      - "!**/*.qmd"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, wasm32-wasip2, riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex
            nexd
            interface/cypher
            storage/sim
            libs/serde-proxy
            playbooks/agents
            nex-server/server
            nex-server/client
          cache-targets: true
          cache-on-failure: true
      - name: Core checks
        run: bash ./run.sh --core

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull or build the verification image (QEMU runtime)
        run: |
          if docker pull ghcr.io/ssccsorg/nexus-verify:latest 2>/dev/null; then
            echo "Image pulled successfully."
          else
            echo "Image not found in registry. Building with shared cache..."
            docker buildx build --load \
              --cache-from type=gha,scope=shared-nexus-verify \
              --cache-to type=gha,mode=min,scope=shared-nexus-verify \
              -t ghcr.io/ssccsorg/nexus-verify:latest \
              -f verify/Dockerfile .
          fi
        shell: bash

      - name: MCU runtime verification (QEMU on the virt machine)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/ssccsorg/nexus-verify:latest \
            bash -c "qemu-system-riscv32 -machine virt -bios none -kernel target/riscv32imac-unknown-none-elf/release/nexus-mcu-verify -nographic -no-reboot && riscv64-unknown-elf-size target/riscv32imac-unknown-none-elf/release/nexus-mcu-verify"
        shell: bash

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex-server/server
            nex-server/client
          cache-targets: true
          cache-on-failure: true
      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: nex-server verification
        run: bash ./run.sh --server

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/nex-api
          cache-targets: true
      - name: Gateway checks
        run: bash ./scripts/run-gateway.sh

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexd
            apps/nex-spinwasi-ssccsdocs
            apps/nex-calc
          cache-targets: true
          cache-on-failure: true
      - name: Install socat (required for Unix socket RPC)
        run: sudo apt-get update && sudo apt-get install -y socat
      - uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: App verification
        run: bash ./run.sh --apps

  playbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex
            interface/cypher
            playbooks/agents
          cache-targets: true
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playbook verification
        run: bash ./run.sh --playbooks
