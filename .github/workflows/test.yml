name: Test Suite

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "fih/**"
      - "nex/**"
      - "nexd/**"
      - "nex-server/**"
      - "apps/nex-api/**"
      - "storage/**"
      - "libs/**"
      - "verify/**"
      - "apps/nex-spinwasi-ssccsdocs/**"
      - "apps/nex-calc/**"
      - "apps/nex-derive/**"
      - "apps/nex-calc-fihcontract/**"
      - "apps/nex-tagma/**"
      - "playbooks/**"
      - "scripts/**"
      - "run.sh"
      - ".github/workflows/test.yml"
      - "!**/*.md"
      - "!**/*.qmd"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "fih/**"
      - "nex/**"
      - "nexd/**"
      - "nex-server/**"
      - "apps/nex-api/**"
      - "storage/**"
      - "libs/**"
      - "verify/**"
      - "apps/nex-spinwasi-ssccsdocs/**"
      - "apps/nex-calc/**"
      - "apps/nex-derive/**"
      - "apps/nex-calc-fihcontract/**"
      - "apps/nex-tagma/**"
      - "playbooks/**"
      - "scripts/**"
      - "run.sh"
      - ".github/workflows/test.yml"
      - "!**/*.md"
      - "!**/*.qmd"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, wasm32-wasip2, riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex
            nexd
            libs/serde-proxy
            playbooks/agents
            nex-server/server
            nex-server/client
          cache-targets: true
          cache-on-failure: true
      - name: Core checks
        run: bash ./run.sh --core

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex-server/server
            nex-server/client
          cache-targets: true
          cache-on-failure: true
      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: nex-server verification
        run: bash ./run.sh --server

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/nex-api
          cache-targets: true
      - name: Gateway checks
        run: bash ./scripts/run-gateway.sh

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexd
            apps/nex-spinwasi-ssccsdocs
            apps/nex-calc
            apps/nex-derive
          cache-targets: true
          cache-on-failure: true
      - name: Install socat (required for Unix socket RPC)
        run: sudo apt-get update && sudo apt-get install -y socat
      - uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: App verification
        run: bash ./run.sh --apps

  playbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex
            playbooks/agents
          cache-targets: true
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playbook verification
        run: bash ./run.sh --playbooks

  # The demonstration is a deployment of a package it does not own, so it is checked against the frame as published
  # rather than against a copy: the clone is what a reader's first run does. The layer's runner performs the same steps
  # from a checkout and then serves the board, so this job runs the check alone.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: storage/ref
          cache-targets: true
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storage/ref/demo/app/package-lock.json
      - name: Demonstration
        run: bash ./run.sh --demo-check
      - uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: storage/ref/demo/app/dist
          if-no-files-found: error

  # A push to main publishes the board the check just built, so what a reader opens is the bytes the suite passed rather
  # than a second build of the same commit. A pull request stops at the artifact, because a branch is read and not
  # published. The job waits on every other, so a commit that breaks a layer never reaches the address.
  deploy:
    needs: [core, server, gateway, apps, playbooks, demo]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: nexus-demo
      url: https://nexus-demo-b5z.pages.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: demo-dist
          path: storage/ref/demo/app/dist
      - name: Deploy the board
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ./run.sh --demo-deploy
