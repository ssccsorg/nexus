name: Test Suite

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "fih/**"
      - "nex/**"
      - "nexd/**"
      - "nex-server/**"
      - "apps/nex-api/**"
      - "storage/**"
      - "libs/**"
      - "verify/**"
      - "apps/nex-spinwasi-ssccsdocs/**"
      - "apps/nex-calc/**"
      - "apps/nex-derive/**"
      - "apps/nex-calc-fihcontract/**"
      - "apps/nex-tagma/**"
      - "playbooks/**"
      - "scripts/**"
      - "run.sh"
      - ".github/workflows/test.yml"
      - "!**/*.md"
      - "!**/*.qmd"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "fih/**"
      - "nex/**"
      - "nexd/**"
      - "nex-server/**"
      - "apps/nex-api/**"
      - "storage/**"
      - "libs/**"
      - "verify/**"
      - "apps/nex-spinwasi-ssccsdocs/**"
      - "apps/nex-calc/**"
      - "apps/nex-derive/**"
      - "apps/nex-calc-fihcontract/**"
      - "apps/nex-tagma/**"
      - "playbooks/**"
      - "scripts/**"
      - "run.sh"
      - ".github/workflows/test.yml"
      - "!**/*.md"
      - "!**/*.qmd"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, wasm32-wasip2, riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex
            nexd
            libs/serde-proxy
            playbooks/agents
            nex-server/server
            nex-server/client
          cache-targets: true
          cache-on-failure: true
      - name: Core checks
        run: bash ./run.sh --core

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex-server/server
            nex-server/client
          cache-targets: true
          cache-on-failure: true
      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: nex-server verification
        run: bash ./run.sh --server

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/nex-api
          cache-targets: true
      - name: Gateway checks
        run: bash ./scripts/run-gateway.sh

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexd
            apps/nex-spinwasi-ssccsdocs
            apps/nex-calc
            apps/nex-derive
          cache-targets: true
          cache-on-failure: true
      - name: Install socat (required for Unix socket RPC)
        run: sudo apt-get update && sudo apt-get install -y socat
      - uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: App verification
        run: bash ./run.sh --apps

  playbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nex
            playbooks/agents
          cache-targets: true
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playbook verification
        run: bash ./run.sh --playbooks

  # The demonstration is a deployment of a package it does not own, so it is checked against the frame as published
  # rather than against a copy: the clone is what a reader's first run does.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: storage/ref
          cache-targets: true
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storage/ref/demo/app/package-lock.json
      # The application names the frame five levels up from itself, so the frame sits beside this checkout.
      - name: Put the frame beside this checkout
        run: git clone --depth 1 https://github.com/ssccsorg/skene "${{ github.workspace }}/../skene"
      # The end-to-end case runs the importer against the committed volume; without this binary it skips.
      - name: Build the reference tool
        run: cargo build -p nexus-storage-ref
      - name: Install the application
        working-directory: storage/ref/demo/app
        run: npm ci
      - name: Test the application
        working-directory: storage/ref/demo/app
        run: npm test
      - name: Build the application
        working-directory: storage/ref/demo/app
        run: npm run build
      - name: The build carries the board
        run: test -f storage/ref/demo/app/dist/projects.json && test -d storage/ref/demo/app/dist/scenario
