[package]
name = "nex-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nex-core = { path = "../nex-core" }
nex-fih = { path = "../nex-fih" }
serde.workspace = true
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
cfg-if = "1"
futures-executor = "0.3"
