[package]
name = "nex"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nex-core = { path = "../core" }
nex-fih = { path = "../fih" }
nex-io = { path = "../io" }
serde.workspace = true
serde_json = "1"
async-trait = "0.1"
futures-executor = "0.3"
log = "0.4"

[features]
default = []
cf = ["dep:worker"]

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.5" }
tempfile = "3"
nexus-storage-sim = { path = "../../storage/sim" }
nexus-gateway-serde-proxy = { path = "../../libs/serde-proxy" }
ureq = { version = "3", features = ["json"] }
