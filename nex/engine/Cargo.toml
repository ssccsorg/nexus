[package]
name = "nex"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nex-core = { path = "../core" }
nex-fih = { path = "../fih" }
nexus-model = { path = "../../model" }
serde.workspace = true
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
cfg-if = "1"
futures-executor = "0.3"
async-trait = "0.1"
walkdir = "2"
sha2 = "0.10"
log = "0.4"
tagma-core = { git = "https://github.com/ssccsorg/syntagma", branch = "main" }

[features]
default = []
cf = ["dep:worker"]

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.5" }
tempfile = "3"
nexus-storage-sim = { path = "../../storage/sim" }
nexus-gateway-serde-proxy = { path = "../../libs/serde-proxy" }
ureq = { version = "3", features = ["json"] }
