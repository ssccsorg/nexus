[workspace]
resolver = "2"
members = ["core", "fih", "process", "io"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
log = "0.4"
chton = { git = "https://github.com/ssccsorg/chton", branch = "main" }
tagma-core = { git = "https://github.com/ssccsorg/syntagma", branch = "main" }
tagma-kv = { git = "https://github.com/ssccsorg/syntagma", branch = "main" }
