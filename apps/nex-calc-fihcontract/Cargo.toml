[package]
name = "nex-calc-fihcontract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "FIH-based calculator with FihContract layer — demonstrates governed FIH pipeline"

[workspace]

[dependencies]
nex-io = { path = "../../nex/io" }
nex-storage-ref = { path = "../../nex-storage-ref" }
nex-core = { path = "../../nex/core" }
nex-fih = { path = "../../nex/fih" }
nex = { path = "../../nex/process" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
sha2 = "0.10"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
