[package]
name = "nex-calc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "FIH-based calculator — computation as state space traversal"

[dependencies]
nex-core = { path = "../../nex/core" }
nex-fih = { path = "../../nex/fih" }
nex = { path = "../../nex/process" }
nexus-storage-sim = { path = "../../storage/sim" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
sha2 = "0.10"
postcard = { version = "1", features = ["alloc"] }
tagma-core = { workspace = true }
